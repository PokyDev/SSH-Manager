[package]
name = "ssh-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
# El sufijo _lib evita conflicto de nombre entre el binario y la biblioteca
# en Windows. Ver: https://github.com/rust-lang/cargo/issues/8519
name = "ssh_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = [] }
tauri-plugin-opener  = "2"
tauri-plugin-dialog  = "2.7.1"
tauri-plugin-log     = "2.8.0"
tauri-plugin-os      = "2.3.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

tokio       = { version = "1.52.3", features = ["full"] }

russh       = "0.61.0"
russh-sftp  = "2.2.2"

ssh-key     = { version = "=0.7.0-rc.10", features = ["ed25519", "rsa"] }

sqlx        = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }

thiserror   = "2.0.18"
anyhow      = "1.0.102"

tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

uuid    = { version = "1.23.1", features = ["v4"] }
chrono  = { version = "0.4.44", features = ["serde"] }
argon2  = "0.5.3"
